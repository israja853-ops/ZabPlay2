<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZabPlay - Video Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --main-red: #ff0033; --dark-bg: #000; }
        body { margin: 0; background: var(--dark-bg); color: white; font-family: sans-serif; overflow: hidden; height: 100vh; }

        /* Video Container */
        .player-container { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: contain; }

        /* Overlays */
        .overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.5); display: flex; flex-direction: column; 
            justify-content: space-between; transition: opacity 0.3s; opacity: 1;
            z-index: 10;
        }
        .overlay.hidden { opacity: 0; pointer-events: none; }

        /* Top Bar */
        .top-bar { padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .top-bar i { font-size: 20px; cursor: pointer; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }

        /* Mid Controls */
        .mid-controls { display: flex; justify-content: center; align-items: center; gap: 50px; }
        .mid-controls i { font-size: 35px; cursor: pointer; }
        #play-pause { font-size: 50px; width: 60px; text-align: center; }

        /* Bottom Progress Bar */
        .bottom-bar { padding: 0 15px 15px; }
        .time-info { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 8px; color: #ddd; }
        .seek-bar { 
            width: 100%; height: 5px; background: rgba(255,255,255,0.2); 
            border-radius: 5px; position: relative; cursor: pointer; 
        }
        .progress { height: 100%; background: var(--main-red); width: 0%; border-radius: 5px; position: relative; pointer-events: none; }
        .progress::after { 
            content: ''; position: absolute; right: -6px; top: -4px; 
            width: 14px; height: 14px; background: var(--main-red); border-radius: 50%; 
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }

        /* Title Section */
        .video-details { padding: 15px; border-bottom: 1px solid #222; background: #050505; }
        .video-details h2 { margin: 0; font-size: 18px; font-weight: 500; color: #fff; }

        /* Suggested List */
        .next-videos { height: calc(100vh - 360px); overflow-y: auto; padding: 15px; padding-bottom: 80px; }
        .video-item { display: flex; gap: 12px; margin-bottom: 18px; position: relative; }
        .video-item img { width: 130px; height: 75px; border-radius: 8px; object-fit: cover; background: #111; }
        .v-info { flex: 1; }
        .v-info h4 { margin: 0; font-size: 14px; line-height: 1.3; font-weight: 500; }
        .v-info p { margin: 5px 0 0; font-size: 11px; color: #888; }

        /* Lock Screen */
        .locked-overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 1000; display: none; align-items: center; justify-content: center;
            background: transparent;
        }
        .locked-overlay i { font-size: 50px; color: white; opacity: 0.6; padding: 20px; }

        /* Bottom Nav */
        .bottom-nav { 
            position: fixed; bottom: 0; width: 100%; height: 70px; 
            background: #080808; display: flex; justify-content: space-around; 
            align-items: center; border-top: 1px solid #222; z-index: 100;
        }
        .nav-item { color: #555; text-align: center; font-size: 11px; text-decoration: none; }
        .nav-item.active { color: var(--main-red); }
        .nav-item i { font-size: 22px; display: block; margin-bottom: 5px; }
    </style>
</head>
<body>

    <div class="player-container" id="container" onclick="handleContainerClick()">
        <video id="mainVideo" src="" poster="https://picsum.photos/800/450?nature"></video>
        
        <div class="overlay" id="mainControls">
            <div class="top-bar">
                <i class="fas fa-chevron-down" onclick="window.history.back()"></i>
                <div style="display:flex; gap:25px;">
                    <i class="fas fa-music" id="mp3Btn" onclick="toggleMP3(event)" title="MP3 Mode"></i>
                    <i class="fas fa-lock" id="lockBtn" onclick="toggleLock(event)"></i>
                    <i class="fas fa-ellipsis-v"></i>
                </div>
            </div>

            <div class="mid-controls">
                <i class="fas fa-step-backward" onclick="rewind(event)"></i>
                <i class="fas fa-play" id="play-pause" onclick="togglePlay(event)"></i>
                <i class="fas fa-step-forward" onclick="forward(event)"></i>
            </div>

            <div class="bottom-bar">
                <div class="time-info">
                    <span id="currentTime">00:00</span>
                    <span id="totalTime">00:00</span>
                </div>
                <div class="seek-bar" onclick="seek(event)">
                    <div class="progress" id="progressBar"></div>
                </div>
            </div>
        </div>

        <div class="locked-overlay" id="lockedUI" onclick="unlock(event)">
            <i class="fas fa-lock"></i>
        </div>
    </div>

    <div class="video-details">
        <h2 id="videoTitle">Now Playing...</h2>
    </div>

    <div class="next-videos" id="suggestionList">
        </div>

    <nav class="bottom-nav">
        <a href="video_home.html" class="nav-item active"><i class="fas fa-play-circle"></i><span>Videos</span></a>
        <a href="music_home.html" class="nav-item"><i class="fas fa-music"></i><span>Music</span></a>
    </nav>

    <script>
        const video = document.getElementById('mainVideo');
        const controls = document.getElementById('mainControls');
        const playBtn = document.getElementById('play-pause');
        const progressBar = document.getElementById('progressBar');
        const videoTitle = document.getElementById('videoTitle');
        let isLocked = false;
        let hideTimeout;

        // URL से वीडियो का नाम निकालें
        const params = new URLSearchParams(window.location.search);
        const vName = params.get('name');
        if(vName) videoTitle.innerText = vName;

        function togglePlay(e) {
            if(e) e.stopPropagation();
            if (video.paused) {
                video.play().catch(() => alert("Select a real video file from Home."));
                playBtn.className = "fas fa-pause";
            } else {
                video.pause();
                playBtn.className = "fas fa-play";
            }
            resetTimer();
        }

        function handleContainerClick() {
            if(isLocked) return;
            if (controls.classList.contains('hidden')) {
                controls.classList.remove('hidden');
                resetTimer();
            } else {
                controls.classList.add('hidden');
            }
        }

        function resetTimer() {
            clearTimeout(hideTimeout);
            if(!video.paused) {
                hideTimeout = setTimeout(() => {
                    controls.classList.add('hidden');
                }, 3000);
            }
        }

        video.ontimeupdate = () => {
            if(video.duration) {
                const perc = (video.currentTime / video.duration) * 100;
                progressBar.style.width = perc + "%";
                document.getElementById('currentTime').innerText = formatTime(video.currentTime);
            }
        };

        video.onloadedmetadata = () => {
            document.getElementById('totalTime').innerText = formatTime(video.duration);
        };

        function formatTime(secs) {
            let m = Math.floor(secs / 60);
            let s = Math.floor(secs % 60);
            return (m < 10 ? "0"+m : m) + ":" + (s < 10 ? "0"+s : s);
        }

        function seek(e) {
            e.stopPropagation();
            const rect = e.currentTarget.getBoundingClientRect();
            const pos = (e.clientX - rect.left) / rect.width;
            if(video.duration) video.currentTime = pos * video.duration;
        }

        function toggleLock(e) {
            e.stopPropagation();
            isLocked = true;
            controls.classList.add('hidden');
            document.getElementById('lockedUI').style.display = 'flex';
        }

        function unlock(e) {
            e.stopPropagation();
            isLocked = false;
            document.getElementById('lockedUI').style.display = 'none';
            controls.classList.remove('hidden');
            resetTimer();
        }

        function forward(e) { e.stopPropagation(); video.currentTime += 60; }
        function rewind(e) { e.stopPropagation(); video.currentTime -= 60; }

        function toggleMP3(e) {
            e.stopPropagation();
            const btn = document.getElementById('mp3Btn');
            if(video.style.opacity === "0") {
                video.style.opacity = "1";
                btn.style.color = "white";
            } else {
                video.style.opacity = "0";
                btn.style.color = "#ff0033";
                alert("MP3 Mode: Video hidden, Audio only.");
            }
        }

        // Suggested List load
        const list = document.getElementById('suggestionList');
        for(let i=1; i<=6; i++) {
            list.innerHTML += `
                <div class="video-item">
                    <img src="https://picsum.photos/200/120?random=${i+10}">
                    <div class="v-info">
                        <h4>Recommended Video Clip #${i}</h4>
                        <p>ZabPlay Media • 1.2M views</p>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
