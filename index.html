<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZabPlay - Master Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --main-red: #ff0033; --dark-bg: #000; --card-bg: #121212; }
        body { margin: 0; background: var(--dark-bg); color: white; font-family: sans-serif; overflow: hidden; height: 100vh; }

        /* --- PLAYER STYLE (TOP) --- */
        .player-container { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; overflow: hidden; z-index: 10; }
        video { width: 100%; height: 100%; object-fit: contain; }
        .overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.5); display: flex; flex-direction: column; 
            justify-content: space-between; transition: opacity 0.3s; opacity: 1; z-index: 11;
        }
        .overlay.hidden { opacity: 0; pointer-events: none; }
        .top-bar { padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .mid-controls { display: flex; justify-content: center; align-items: center; gap: 50px; }
        .mid-controls i { font-size: 35px; cursor: pointer; }
        #play-pause { font-size: 50px; width: 60px; text-align: center; }
        .bottom-bar { padding: 0 15px 15px; }
        .time-info { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 8px; color: #ddd; }
        .seek-bar { width: 100%; height: 5px; background: rgba(255,255,255,0.2); border-radius: 5px; position: relative; cursor: pointer; }
        .progress { height: 100%; background: var(--main-red); width: 0%; border-radius: 5px; position: relative; pointer-events: none; }
        .progress::after { content: ''; position: absolute; right: -6px; top: -4px; width: 14px; height: 14px; background: var(--main-red); border-radius: 50%; }

        /* --- LIST STYLE (BOTTOM) --- */
        .content-section { height: calc(100vh - (100vw * 9 / 16)); overflow-y: auto; background: #050505; }
        .video-details { padding: 15px; border-bottom: 1px solid #222; }
        .video-details h2 { margin: 0; font-size: 16px; font-weight: 500; color: #fff; }

        .video-list { padding: 15px; padding-bottom: 90px; }
        .video-card { display: flex; gap: 15px; margin-bottom: 20px; position: relative; cursor: pointer; padding: 5px; border-radius: 8px; }
        .video-card.active { background: rgba(255,0,51,0.1); border-left: 3px solid var(--main-red); }
        .thumb-container { position: relative; width: 130px; height: 75px; min-width: 130px; background: #111; border-radius: 8px; overflow: hidden; }
        .thumb-container video { width: 100%; height: 100%; object-fit: cover; }
        .duration { position: absolute; bottom: 5px; right: 5px; background: rgba(0,0,0,0.8); padding: 2px 5px; font-size: 10px; border-radius: 3px; }
        .video-info h3 { margin: 0; font-size: 13px; color: #eee; line-height: 1.2; }

        /* UI ELEMENTS */
        .scan-btn { position: fixed; bottom: 85px; right: 20px; width: 55px; height: 55px; background: var(--main-red); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(255,0,51,0.4); font-size: 24px; z-index: 100; }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 70px; background: #080808; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #222; z-index: 100; }
        .nav-item { color: #555; text-align: center; font-size: 11px; text-decoration: none; }
        .nav-item.active { color: var(--main-red); }
        .nav-item i { font-size: 22px; display: block; margin-bottom: 5px; }
        .locked-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000; display: none; align-items: center; justify-content: center; background: transparent; }
        .locked-overlay i { font-size: 50px; color: white; opacity: 0.6; }
    </style>
</head>
<body>

    <div class="player-container" onclick="handleContainerClick()">
        <video id="mainVideo" playsinline poster="https://picsum.photos/800/450?nature"></video>
        
        <div class="overlay" id="mainControls">
            <div class="top-bar">
                <i class="fas fa-chevron-down"></i>
                <div style="display:flex; gap:20px;">
                    <i class="fas fa-music" id="mp3Btn" onclick="toggleMP3(event)"></i>
                    <i class="fas fa-lock" id="lockBtn" onclick="toggleLock(event)"></i>
                </div>
            </div>
            <div class="mid-controls">
                <i class="fas fa-step-backward" onclick="rewind(event)"></i>
                <i class="fas fa-play" id="play-pause" onclick="togglePlay(event)"></i>
                <i class="fas fa-step-forward" onclick="forward(event)"></i>
            </div>
            <div class="bottom-bar">
                <div class="time-info"><span id="currentTime">00:00</span><span id="totalTime">00:00</span></div>
                <div class="seek-bar" onclick="seek(event)"><div class="progress" id="progressBar"></div></div>
            </div>
        </div>
        <div class="locked-overlay" id="lockedUI" onclick="unlock(event)"><i class="fas fa-lock"></i></div>
    </div>

    <div class="content-section">
        <div class="video-details"><h2 id="videoTitle">Select a Video to Play</h2></div>
        <div class="video-list" id="video-grid">
            </div>
    </div>

    <div class="scan-btn" onclick="triggerScan()"><i class="fas fa-plus"></i></div>

    <nav class="bottom-nav">
        <div class="nav-item active"><i class="fas fa-play-circle"></i><span>Videos</span></div>
        <a href="music_home.html" class="nav-item"><i class="fas fa-music"></i><span>Music</span></a>
    </nav>

    <script>
        const video = document.getElementById('mainVideo');
        const controls = document.getElementById('mainControls');
        const playBtn = document.getElementById('play-pause');
        const progressBar = document.getElementById('progressBar');
        const videoTitle = document.getElementById('videoTitle');
        let isLocked = false;
        let hideTimeout;

        // 1. Scan and Load Videos
        function triggerScan() {
            const input = document.createElement('input');
            input.type = 'file'; input.accept = 'video/*'; input.multiple = true;
            input.onchange = e => {
                const files = Array.from(e.target.files);
                const grid = document.getElementById('video-grid');
                files.forEach(file => {
                    const url = URL.createObjectURL(file);
                    const card = document.createElement('div');
                    card.className = 'video-card';
                    card.dataset.url = url;
                    card.dataset.name = file.name;
                    card.innerHTML = `
                        <div class="thumb-container">
                            <video src="${url}#t=0.5"></video>
                            <span class="duration" id="dur-${file.lastModified}">00:00</span>
                        </div>
                        <div class="video-info"><h3>${file.name}</h3></div>
                    `;
                    
                    // Duration fix
                    const tVid = document.createElement('video');
                    tVid.src = url;
                    tVid.onloadedmetadata = () => {
                        document.getElementById(`dur-${file.lastModified}`).innerText = formatTime(tVid.duration);
                    };

                    card.onclick = () => playVideo(card);
                    grid.appendChild(card);
                });
            };
            input.click();
        }

        // 2. Play Logic
        function playVideo(card) {
            document.querySelectorAll('.video-card').forEach(c => c.classList.remove('active'));
            card.classList.add('active');
            
            video.src = card.dataset.url;
            videoTitle.innerText = card.dataset.name;
            video.play();
            playBtn.className = "fas fa-pause";
            resetTimer();
        }

        // 3. Player Controls
        function togglePlay(e) {
            e.stopPropagation();
            if (video.paused) { video.play(); playBtn.className = "fas fa-pause"; }
            else { video.pause(); playBtn.className = "fas fa-play"; }
            resetTimer();
        }

        function handleContainerClick() {
            if(isLocked) return;
            controls.classList.toggle('hidden');
            resetTimer();
        }

        function resetTimer() {
            clearTimeout(hideTimeout);
            if(!video.paused) hideTimeout = setTimeout(() => controls.classList.add('hidden'), 3000);
        }

        video.ontimeupdate = () => {
            if(video.duration) {
                progressBar.style.width = (video.currentTime / video.duration) * 100 + "%";
                document.getElementById('currentTime').innerText = formatTime(video.currentTime);
            }
        };

        video.onloadedmetadata = () => { document.getElementById('totalTime').innerText = formatTime(video.duration); };

        function formatTime(secs) {
            let m = Math.floor(secs / 60); let s = Math.floor(secs % 60);
            return (m < 10 ? "0"+m : m) + ":" + (s < 10 ? "0"+s : s);
        }

        function seek(e) {
            e.stopPropagation();
            const rect = e.currentTarget.getBoundingClientRect();
            video.currentTime = ((e.clientX - rect.left) / rect.width) * video.duration;
        }

        function forward(e) { e.stopPropagation(); video.currentTime += 10; }
        function rewind(e) { e.stopPropagation(); video.currentTime -= 10; }

        function toggleLock(e) {
            e.stopPropagation(); isLocked = true;
            controls.classList.add('hidden');
            document.getElementById('lockedUI').style.display = 'flex';
        }

        function unlock(e) {
            e.stopPropagation(); isLocked = false;
            document.getElementById('lockedUI').style.display = 'none';
            controls.classList.remove('hidden');
        }

        function toggleMP3(e) {
            e.stopPropagation();
            const btn = document.getElementById('mp3Btn');
            video.style.opacity = video.style.opacity === "0" ? "1" : "0";
            btn.style.color = video.style.opacity === "0" ? var(--main-red) : "white";
        }
    </script>
</body>
</html>
