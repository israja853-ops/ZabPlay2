<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZabPlay - Home</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --main-red: #ff0033; --dark-bg: #000; --card-bg: #121212; }
        body { margin: 0; background: var(--dark-bg); color: white; font-family: sans-serif; overflow-x: hidden; }

        .header { 
            padding: 20px; display: flex; justify-content: space-between; align-items: center; 
            position: sticky; top: 0; background: var(--dark-bg); z-index: 100;
        }
        .logo-section { display: flex; align-items: center; gap: 10px; }
        .logo-section img { width: 35px; height: 35px; border-radius: 50%; border: 2px solid var(--main-red); }
        .logo-section h1 { font-size: 24px; margin: 0; font-weight: bold; }
        
        .video-list { padding: 10px 15px; padding-bottom: 90px; }
        .video-card { display: flex; gap: 15px; margin-bottom: 20px; position: relative; cursor: pointer; }
        
        .thumb-container { position: relative; width: 150px; height: 85px; min-width: 150px; background: #111; border-radius: 8px; overflow: hidden; }
        .thumb-container video { width: 100%; height: 100%; object-fit: cover; }
        .duration { position: absolute; bottom: 5px; right: 5px; background: rgba(0,0,0,0.8); padding: 2px 5px; font-size: 10px; border-radius: 3px; }

        .video-info { flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .video-info h3 { margin: 0; font-size: 14px; color: #eee; line-height: 1.2; }

        .scan-btn {
            position: fixed; bottom: 90px; right: 20px; 
            width: 55px; height: 55px; background: var(--main-red); 
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 15px rgba(255,0,51,0.4); font-size: 24px; z-index: 99;
        }

        .bottom-nav { 
            position: fixed; bottom: 0; width: 100%; height: 70px; 
            background: #080808; display: flex; justify-content: space-around; 
            align-items: center; border-top: 1px solid #222; 
        }
        .nav-item { text-align: center; color: #555; font-size: 11px; text-decoration: none; }
        .nav-item.active { color: var(--main-red); }
        .nav-item i { font-size: 22px; display: block; margin-bottom: 5px; }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo-section">
            <img src="https://via.placeholder.com/50/ff0033/fff?text=Z" alt="Logo">
            <h1>ZabPlay</h1>
        </div>
        <i class="fas fa-search"></i>
    </header>

    <main class="video-list" id="video-grid">
        </main>

    <div class="scan-btn" onclick="triggerScan()">
        <i class="fas fa-plus"></i>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item active"><i class="fas fa-play-circle"></i><span>Videos</span></a>
        <a href="music_home.html" class="nav-item"><i class="fas fa-music"></i><span>Music</span></a>
    </nav>

    <script>
        function triggerScan() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'video/*';
            input.multiple = true;
            input.onchange = e => {
                const files = Array.from(e.target.files);
                const grid = document.getElementById('video-grid');
                
                files.forEach(file => {
                    const videoUrl = URL.createObjectURL(file);
                    const card = document.createElement('div');
                    card.className = 'video-card';
                    
                    card.innerHTML = `
                        <div class="thumb-container">
                            <video src="${videoUrl}#t=1"></video>
                            <span class="duration" id="dur-${file.lastModified}">00:00</span>
                        </div>
                        <div class="video-info">
                            <h3>${file.name}</h3>
                        </div>
                    `;

                    // Duration nikalna
                    const tempVid = document.createElement('video');
                    tempVid.src = videoUrl;
                    tempVid.onloadedmetadata = () => {
                        const m = Math.floor(tempVid.duration / 60);
                        const s = Math.floor(tempVid.duration % 60);
                        document.getElementById(`dur-${file.lastModified}`).innerText = 
                            (m < 10 ? "0"+m : m) + ":" + (s < 10 ? "0"+s : s);
                    };

                    card.onclick = () => {
                        // URL mein name aur src dono bhej rahe hain
                        window.location.href = `video_player.html?name=${encodeURIComponent(file.name)}&src=${encodeURIComponent(videoUrl)}`;
                    };

                    grid.appendChild(card);
                });
            };
            input.click();
        }
    </script>
</body>
</html>
