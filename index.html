<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZabPlay Premium</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="dark-theme">

    <div id="page-video-list" class="app-page active">
        <header class="main-header">
            <h1>Videos</h1>
            <div class="header-icons">
                <i class="fas fa-plus-circle" onclick="selectFromGallery()"></i>
                <i class="fas fa-search"></i>
                <i class="fas fa-user-circle"></i>
            </div>
        </header>
        <div class="content-scroll" id="video-items-container">
            </div>
    </div>

    <div id="page-music-list" class="app-page">
        <header class="main-header">
            <h1>Music</h1>
            <div class="header-icons">
                <i class="fas fa-plus-circle" onclick="selectFromGallery()"></i>
                <i class="fas fa-search"></i>
            </div>
        </header>
        <div class="content-scroll" id="music-items-container">
            </div>
    </div>

    <div id="player-video-full" class="full-screen-player">
        <div class="video-section">
            <video id="main-v-element"></video>
            <div class="v-overlay" onclick="handleVideoTouch()">
                <div class="v-top-bar">
                    <i class="fas fa-chevron-down" onclick="closePlayers()"></i>
                    <div class="v-top-right">
                        <i class="fas fa-cast"></i>
                        <i class="fas fa-closed-captioning"></i>
                        <i class="fas fa-ellipsis-v"></i>
                    </div>
                </div>
                <div class="v-mid-controls">
                    <i class="fas fa-step-backward"></i>
                    <i class="fas fa-play" id="v-play-btn"></i>
                    <i class="fas fa-step-forward"></i>
                </div>
                <div class="v-bottom-controls">
                    <div class="time-row"><span>02:15</span><span>10:32</span></div>
                    <input type="range" class="red-slider" id="v-slider">
                    <div class="icon-row">
                        <i class="fas fa-volume-up" id="v-mute-btn"></i>
                        <i class="fas fa-expand-alt"></i>
                    </div>
                </div>
            </div>
        </div>
        <div class="next-list-section">
            <h3 class="red-text">Beautiful Nature in 4K</h3>
            <div id="v-suggested-list"></div>
        </div>
    </div>

    <div id="player-music-full" class="full-screen-player">
        <div class="m-header">
            <i class="fas fa-chevron-down" onclick="closePlayers()"></i>
            <span>Now Playing</span>
            <i class="fas fa-ellipsis-v"></i>
        </div>
        <div class="m-art-box">
            <img src="https://via.placeholder.com/300/111/fff?text=ZabPlay" id="m-img">
        </div>
        <div class="m-info-row">
            <div class="m-text">
                <h2 id="m-title-text">Dreams</h2>
                <p id="m-artist-text">Alan Walker</p>
            </div>
            <i class="fas fa-heart red-heart"></i>
        </div>
        <div class="m-controls-section">
            <input type="range" class="red-slider" id="m-slider">
            <div class="m-time-info"><span>01:24</span><span>03:48</span></div>
            <div class="m-btns-row">
                <i class="fas fa-shuffle"></i>
                <i class="fas fa-step-backward"></i>
                <div class="m-play-btn-circle" id="m-play-btn"><i class="fas fa-play"></i></div>
                <i class="fas fa-step-forward"></i>
                <i class="fas fa-repeat"></i>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-tab active" onclick="switchTab('page-video-list', this)">
            <i class="fas fa-play-circle"></i>
            <span>Videos</span>
        </div>
        <div class="nav-tab" onclick="switchTab('page-music-list', this)">
            <i class="fas fa-music"></i>
            <span>Music</span>
        </div>
    </nav>

    <script src="app.js"></script>
</body>
</html>
