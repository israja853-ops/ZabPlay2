<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZabPlay - Music Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --main-red: #ff0033; --dark-bg: #000; }
        body { margin: 0; background: var(--dark-bg); color: white; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Top Header */
        .header { padding: 20px; display: flex; justify-content: space-between; align-items: center; position: relative; }
        .header i { font-size: 20px; cursor: pointer; }
        .header span { font-size: 16px; font-weight: 500; }

        /* 3-Dot Menu Dropdown */
        .dropdown {
            position: absolute; right: 20px; top: 60px; background: #1a1a1a;
            border-radius: 10px; display: none; flex-direction: column; z-index: 100;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5); width: 150px;
        }
        .dropdown button {
            background: none; border: none; color: white; padding: 12px 15px;
            text-align: left; display: flex; align-items: center; gap: 10px; cursor: pointer;
        }
        .dropdown button:hover { background: #333; }

        /* Album Art Area */
        .player-main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .album-art { 
            width: 85%; aspect-ratio: 1/1; border-radius: 25px; 
            box-shadow: 0 10px 40px rgba(255,0,51,0.2); object-fit: cover;
            margin-bottom: 40px; background: #121212;
        }

        /* Song Info */
        .song-info { text-align: left; width: 85%; margin-bottom: 30px; }
        .song-info h1 { margin: 0; font-size: 24px; font-weight: bold; }
        .song-info p { margin: 5px 0; color: #888; font-size: 16px; }

        /* Progress Bar */
        .progress-container { width: 85%; margin-bottom: 30px; }
        .time-labels { display: flex; justify-content: space-between; font-size: 12px; margin-top: 8px; color: #888; }
        .seek-bar { width: 100%; height: 4px; background: #333; border-radius: 10px; position: relative; cursor: pointer; }
        .fill { height: 100%; background: var(--main-red); width: 0%; border-radius: 10px; position: relative; }
        .fill::after { content: ''; position: absolute; right: -6px; top: -4px; width: 12px; height: 12px; background: var(--main-red); border-radius: 50%; }

        /* Controls */
        .controls { display: flex; justify-content: space-between; align-items: center; width: 85%; margin-bottom: 40px; }
        .controls i { font-size: 20px; cursor: pointer; color: #fff; transition: 0.2s; }
        .controls .play-btn { 
            width: 65px; height: 65px; background: var(--main-red); 
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 28px;
        }
        .controls i.active { color: var(--main-red); }

        /* Audio Element (Hidden) */
        audio { display: none; }
    </style>
</head>
<body>

    <div class="header">
        <i class="fas fa-chevron-down" onclick="window.history.back()"></i>
        <span>Now Playing</span>
        <i class="fas fa-ellipsis-v" onclick="toggleMenu()"></i>
        
        <div class="dropdown" id="menu">
            <button onclick="shareSong()"><i class="fas fa-share-alt"></i> Share</button>
            <button onclick="deleteSong()"><i class="fas fa-trash"></i> Delete</button>
            <button onclick="openMixer()"><i class="fas fa-sliders-h"></i> Mixer</button>
        </div>
    </div>

    <div class="player-main">
        <img src="https://picsum.photos/400" id="thumb" class="album-art" alt="Song Art">
        
        <div class="song-info">
            <h1 id="title">Dreams</h1>
            <p id="artist">Alan Walker</p>
        </div>

        <div class="progress-container">
            <div class="seek-bar" onclick="seek(event)">
                <div class="fill" id="progressFill"></div>
            </div>
            <div class="time-labels">
                <span id="current">00:00</span>
                <span id="total">03:48</span>
            </div>
        </div>

        <div class="controls">
            <i class="fas fa-random" id="shuffle" onclick="toggleBtn(this)"></i>
            <i class="fas fa-step-backward" onclick="prevSong()"></i>
            <div class="play-btn" onclick="togglePlay()">
                <i class="fas fa-play" id="playIcon"></i>
            </div>
            <i class="fas fa-step-forward" onclick="nextSong()"></i>
            <i class="fas fa-redo-alt" id="repeat" onclick="toggleRepeat(this)"></i>
        </div>
    </div>

    <audio id="audioSource" src="sample_music.mp3"></audio>

    <script>
        const audio = document.getElementById('audioSource');
        const playIcon = document.getElementById('playIcon');
        const progressFill = document.getElementById('progressFill');
        const currentTimeEl = document.getElementById('current');
        const totalTimeEl = document.getElementById('total');
        let isRepeating = false;

        // 1. Play/Pause Function
        function togglePlay() {
            if (audio.paused) {
                audio.play();
                playIcon.className = "fas fa-pause";
            } else {
                audio.pause();
                playIcon.className = "fas fa-play";
            }
        }

        // 2. Update Progress Bar & Time
        audio.ontimeupdate = () => {
            const perc = (audio.currentTime / audio.duration) * 100;
            progressFill.style.width = perc + "%";
            currentTimeEl.innerText = formatTime(audio.currentTime);
        };

        audio.onloadedmetadata = () => {
            totalTimeEl.innerText = formatTime(audio.duration);
        };

        function formatTime(secs) {
            let m = Math.floor(secs / 60);
            let s = Math.floor(secs % 60);
            return (m < 10 ? "0"+m : m) + ":" + (s < 10 ? "0"+s : s);
        }

        // 3. Seek Function
        function seek(e) {
            const rect = e.target.closest('.seek-bar').getBoundingClientRect();
            const pos = (e.clientX - rect.left) / rect.width;
            audio.currentTime = pos * audio.duration;
        }

        // 4. Repeat (Single Song Loop)
        function toggleRepeat(el) {
            isRepeating = !isRepeating;
            audio.loop = isRepeating;
            el.classList.toggle('active');
            if(isRepeating) alert("Loop Mode: ON (This song will play again and again)");
        }

        // 5. Menu Toggle (3 Dots)
        function toggleMenu() {
            const menu = document.getElementById('menu');
            menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';
        }

        // 6. Action Functions
        function shareSong() { alert("Sharing this MP3 file..."); toggleMenu(); }
        function deleteSong() { if(confirm("Delete this song forever?")) window.history.back(); }
        function openMixer() { alert("Opening Audio Mixer/Equalizer..."); toggleMenu(); }
        
        function nextSong() { alert("Loading next song from your list..."); }
        function prevSong() { alert("Loading previous song..."); }
        function toggleBtn(el) { el.classList.toggle('active'); }

        // Close menu on click outside
        window.onclick = function(event) {
            if (!event.target.matches('.fa-ellipsis-v')) {
                document.getElementById('menu').style.display = "none";
            }
        }
    </script>
</body>
</html>
