<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZabPlay - Video Home</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --main-red: #ff0033; --dark-bg: #000; --card-bg: #121212; }
        body { margin: 0; background: var(--dark-bg); color: white; font-family: sans-serif; overflow-x: hidden; }

        /* Header Styles */
        .header { 
            padding: 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            position: sticky; 
            top: 0; 
            background: var(--dark-bg); 
            z-index: 100;
        }
        .logo-section { display: flex; align-items: center; gap: 10px; }
        .logo-section img { width: 35px; height: 35px; border-radius: 50%; border: 2px solid var(--main-red); }
        .logo-section h1 { font-size: 24px; margin: 0; font-weight: bold; }
        
        .action-icons i { font-size: 20px; cursor: pointer; margin-left: 20px; transition: 0.3s; }
        
        /* Selection Mode Header */
        .selection-header {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 70px;
            background: #1a1a1a;
            justify-content: space-between; align-items: center;
            padding: 0 20px; box-sizing: border-box; z-index: 200;
        }

        /* Video List Styling */
        .video-list { padding: 10px 15px; padding-bottom: 90px; }
        .video-card { 
            display: flex; gap: 15px; margin-bottom: 20px; 
            position: relative; padding: 5px; border-radius: 10px; transition: 0.2s;
        }
        .video-card.selected { background: rgba(255, 0, 51, 0.2); }
        
        .thumb-container { position: relative; width: 150px; height: 85px; min-width: 150px; }
        .thumb-container img, .thumb-container video { 
            width: 100%; height: 100%; border-radius: 8px; object-fit: cover; background: #222;
        }
        .duration { 
            position: absolute; bottom: 5px; right: 5px; 
            background: rgba(0,0,0,0.8); padding: 2px 5px; font-size: 10px; border-radius: 3px; 
        }

        .video-info { flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .video-info h3 { margin: 0; font-size: 15px; font-weight: 500; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        /* Checkbox hidden for real feel */
        .select-dot {
            position: absolute; top: 10px; left: 10px; width: 20px; height: 20px;
            background: white; border-radius: 50%; display: none; border: 2px solid var(--main-red);
        }
        .selected .select-dot { display: block; background: var(--main-red); }

        /* Bottom Nav */
        .bottom-nav { 
            position: fixed; bottom: 0; width: 100%; height: 70px; 
            background: #080808; display: flex; justify-content: space-around; 
            align-items: center; border-top: 1px solid #222; 
        }
        .nav-item { text-align: center; color: #555; font-size: 11px; }
        .nav-item.active { color: var(--main-red); }
        .nav-item i { font-size: 22px; display: block; margin-bottom: 5px; }

        /* Plus Button for Scanning */
        .scan-btn {
            position: fixed; bottom: 90px; right: 20px; 
            width: 55px; height: 55px; background: var(--main-red); 
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 15px rgba(255,0,51,0.4); font-size: 24px;
        }
    </style>
</head>
<body>

    <header class="header" id="normal-header">
        <div class="logo-section">
            <img src="https://via.placeholder.com/50/ff0033/fff?text=Z" alt="Logo">
            <h1>ZabPlay</h1>
        </div>
        <div class="action-icons">
            <i class="fas fa-search"></i>
        </div>
    </header>

    <div class="selection-header" id="selection-header">
        <div class="logo-section">
            <i class="fas fa-times" onclick="exitSelection()"></i>
            <h1 id="select-count">0 Selected</h1>
        </div>
        <div class="action-icons">
            <i class="fas fa-share-alt" onclick="shareVideos()"></i>
            <i class="fas fa-trash" onclick="deleteVideos()"></i>
        </div>
    </div>

    <main class="video-list" id="video-grid">
        </main>

    <div class="scan-btn" onclick="triggerScan()">
        <i class="fas fa-plus"></i>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active">
            <i class="fas fa-play-circle"></i><span>Videos</span>
        </div>
        <div class="nav-item">
            <i class="fas fa-music"></i><span>Music</span>
        </div>
    </nav>

    <script>
        let isSelectionMode = false;
        let selectedItems = [];

        // 1. Scan Videos from Gallery
        function triggerScan() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'video/*';
            input.multiple = true;
            input.onchange = e => {
                const files = Array.from(e.target.files);
                const grid = document.getElementById('video-grid');
                
                files.forEach(file => {
                    const url = URL.createObjectURL(file);
                    const card = document.createElement('div');
                    card.className = 'video-card';
                    card.innerHTML = `
                        <div class="select-dot"></div>
                        <div class="thumb-container">
                            <video src="${url}"></video>
                            <span class="duration">00:00</span>
                        </div>
                        <div class="video-info">
                            <h3>${file.name}</h3>
                        </div>
                    `;

                    // Long Press Event
                    let timer;
                    card.addEventListener('touchstart', () => {
                        timer = setTimeout(() => enterSelectionMode(card), 800);
                    });
                    card.addEventListener('touchend', () => clearTimeout(timer));
                    
                    // Click Event
                    card.onclick = () => {
                        if(isSelectionMode) toggleSelect(card);
                        else alert("Playing: " + file.name); // Next page link
                    };

                    grid.appendChild(card);
                });
            };
            input.click();
        }

        // 2. Selection Logic
        function enterSelectionMode(el) {
            isSelectionMode = true;
            document.getElementById('normal-header').style.display = 'none';
            document.getElementById('selection-header').style.display = 'flex';
            toggleSelect(el);
        }

        function toggleSelect(el) {
            el.classList.toggle('selected');
            const allSelected = document.querySelectorAll('.video-card.selected');
            document.getElementById('select-count').innerText = allSelected.length + " Selected";
            if(allSelected.length === 0) exitSelection();
        }

        function exitSelection() {
            isSelectionMode = false;
            document.querySelectorAll('.video-card').forEach(c => c.classList.remove('selected'));
            document.getElementById('normal-header').style.display = 'flex';
            document.getElementById('selection-header').style.display = 'none';
        }

        // 3. Delete & Share Actions
        function deleteVideos() {
            if(confirm("Delete selected videos?")) {
                document.querySelectorAll('.video-card.selected').forEach(c => c.remove());
                exitSelection();
            }
        }

        function shareVideos() {
            alert("Sharing feature opening... (Bluetooth/WhatsApp)");
            // In a real app, Navigator.share() would go here
        }
    </script>
</body>
</html>
